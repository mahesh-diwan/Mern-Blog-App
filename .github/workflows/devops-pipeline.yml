test-and-scan:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Disabling shallow clone is required for relevant SonarCloud analysis
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    - name: Install Frontend Deps & Lint
      run: |
        cd client
        npm install
        npx eslint src/ --max-warnings 0

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        # This ensures the pipeline waits for the scan result
        # and fails the build if the Quality Gate fails.
        args: >
          -Dsonar.qualitygate.wait=true
